# nginx：托管前端静态文件 + 把 /api、/runs、/testsite 反代给 api 容器。
#
# 为什么前端必须走反代而不是直接写 http://api:8000：
# 1. 浏览器里的 JS 不认识 compose 的服务名，只认识当前页面的 host；
# 2. 走同源之后，鉴权头、Cookie、WS 全都不用处理跨域。
#    前端代码里 BASE 写的是相对路径 /api/v1（见 src/api.ts），
#    就是为了让"开发时 vite proxy、生产时 nginx 反代"两套环境共用同一份代码。

# WebSocket 的 Upgrade 头：不能无条件写 Connection: upgrade。
# 普通 HTTP 请求带 upgrade 会破坏 keep-alive，所以按"客户端有没有发 Upgrade"分流。
# ⚠️ 这条 map 必须放在 server 块外面（它属于 http 上下文，
#    而 conf.d/*.conf 就是被 include 进 http 块的）。
#    写在 server 里面 nginx 会直接拒绝启动："map directive is not allowed here"。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传录音：默认 client_max_body_size 只有 1MB，
    # 60 秒的 webm 大约 300KB 但也可能更长；后端上限是 VOICE_MAX_MB=20，
    # 这里给 25MB 留余量（nginx 先挡一层，业务层再按配置精确判）
    client_max_body_size 25m;

    # ---- 后端 API（含语音 WebSocket）----
    location /api/ {
        proxy_pass http://api:8000;

        # 这三行是 WebSocket 能通的全部秘密：
        # HTTP/1.1 + Upgrade + Connection，少一个浏览器就会报
        # "WebSocket connection failed" 而没有任何有用信息。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 语音会话是长连接（一次会话里反复收 tts.chunk），
        # 默认 60s 空闲就断，会把「说了话等结果」的场景拦腰砍断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 流式播报是分块下发的，必须关掉缓冲，否则 nginx 会攒够一坨再吐
        proxy_buffering off;
    }

    # ---- 任务产物（截图）----
    # 走签名 URL：/runs/<task_id>/step_3.png?e=<过期时间>&sig=<HMAC>
    # 由后端路由校验，不是 StaticFiles 直出——所以必须反代，不能让 nginx 直接读盘
    location /runs/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 本地测试站 ----
    # Agent 要访问它，人的浏览器也要能打开看（排查时非常有用）。
    # ⚠️ 容器里 Agent 用的地址是 http://api:8000/testsite/...，
    #    不是 127.0.0.1 —— 在 worker 容器里 127.0.0.1 指的是它自己。
    location /testsite/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ---- API 文档（演示时直接给人看接口）----
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ---- 前端静态资源 ----
    # 带 hash 的构建产物可以长缓存；index.html 必须每次回源，
    # 否则发版后用户浏览器还拿着旧 index，引用的 js 文件已经不存在了
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # SPA 兜底：任何未命中的路径都回 index.html
        # （本项目目前没有前端路由，但这条加上无害且省得将来踩坑）
        try_files $uri $uri/ /index.html;
    }
}
