# alembic 配置。
# 注意这里**不写 sqlalchemy.url** —— URL 在 alembic/env.py 里从 app.config 取，
# 理由：环境变量只有一处真相（.env）。写在这里就等于把密码抄了两份，
# 迟早出现"改了 .env 但迁移连的还是老库"这种事。

[alembic]
script_location = alembic
# 让 `app` 包可导入：从 backend/ 目录执行 alembic 时，. 就是 backend/
prepend_sys_path = .
version_path_separator = os
# 迁移文件名带时间前缀，方便按时间排序看改动顺序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
