<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- ============ WebPilot 架构图（与 README 的 Mermaid 是同一份内容的两种载体） ============ -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .box  { fill:#ffffff; stroke:#94a3b8; stroke-width:1.5; }
    .zone { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.2; stroke-dasharray:6 4; }
    .zt   { font-size:13px; fill:#94a3b8; font-weight:600; }
    .t    { font-size:14px; fill:#0f172a; font-weight:600; }
    .s    { font-size:11.5px; fill:#475569; }
    .lbl  { font-size:11px; fill:#64748b; }
    .flow { stroke:#64748b; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .flowB{ stroke:#2563eb; stroke-width:1.5; fill:none; marker-end:url(#arrB); stroke-dasharray:5 4; }
  </style>
  <rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>

  <!-- ================= 泳道 ================= -->
  <rect class="zone" x="20"  y="50" width="210" height="580" rx="10"/>
  <text class="zt" x="125" y="72" text-anchor="middle">用户侧</text>

  <rect class="zone" x="260" y="50" width="230" height="580" rx="10"/>
  <text class="zt" x="375" y="72" text-anchor="middle">接入层（web 容器 :8080）</text>

  <rect class="zone" x="520" y="50" width="240" height="580" rx="10"/>
  <text class="zt" x="640" y="72" text-anchor="middle">应用层（api 容器 :8000）</text>

  <rect class="zone" x="790" y="50" width="310" height="580" rx="10"/>
  <text class="zt" x="945" y="72" text-anchor="middle">执行层（worker 容器）</text>

  <!-- ================= 用户侧 ================= -->
  <rect class="box" x="40" y="100" width="170" height="60" rx="8"/>
  <text class="t" x="125" y="125" text-anchor="middle">人</text>
  <text class="s" x="125" y="144" text-anchor="middle">下任务 / 审批 / 语音</text>

  <rect class="box" x="40" y="220" width="170" height="86" rx="8"/>
  <text class="t" x="125" y="246" text-anchor="middle">React 前端</text>
  <text class="s" x="125" y="264" text-anchor="middle">任务表单 · 轨迹时间线</text>
  <text class="s" x="125" y="280" text-anchor="middle">统计看板 · 语音会话面板</text>
  <text class="s" x="125" y="296" text-anchor="middle">我的任务（用户隔离）</text>

  <!-- ================= 接入层 ================= -->
  <rect class="box" x="280" y="150" width="190" height="120" rx="8"/>
  <text class="t" x="375" y="178" text-anchor="middle">nginx</text>
  <text class="s" x="375" y="198" text-anchor="middle">托管前端 dist</text>
  <text class="s" x="375" y="214" text-anchor="middle">/api /runs /testsite 反代</text>
  <text class="s" x="375" y="230" text-anchor="middle">WS Upgrade 三件套</text>
  <text class="s" x="375" y="246" text-anchor="middle">同源免跨域</text>

  <!-- ================= 应用层 ================= -->
  <rect class="box" x="540" y="100" width="200" height="170" rx="8"/>
  <text class="t" x="640" y="126" text-anchor="middle">FastAPI</text>
  <text class="s" x="640" y="146" text-anchor="middle">auth(JWT) · tasks · approvals</text>
  <text class="s" x="640" y="162" text-anchor="middle">knowledge(RAG) · stats</text>
  <text class="s" x="640" y="178" text-anchor="middle">credentials · /voice/ws</text>
  <text class="s" x="640" y="200" text-anchor="middle">任务入队；订阅事件桥</text>
  <text class="s" x="640" y="216" text-anchor="middle">runs 文件经签名 URL 出门</text>
  <text class="s" x="640" y="240" text-anchor="middle">启动时跑迁移（唯一执行者）</text>
  <text class="s" x="640" y="256" text-anchor="middle">托管本地测试站 /testsite</text>

  <rect class="box" x="540" y="330" width="200" height="60" rx="8"/>
  <text class="t" x="640" y="354" text-anchor="middle">Redis 7</text>
  <text class="s" x="640" y="372" text-anchor="middle">arq 队列 + pub/sub 事件桥</text>

  <rect class="box" x="540" y="440" width="200" height="86" rx="8"/>
  <text class="t" x="640" y="466" text-anchor="middle">语音模型（本地推理）</text>
  <text class="s" x="640" y="484" text-anchor="middle">faster-whisper small（ASR）</text>
  <text class="s" x="640" y="500" text-anchor="middle">edge-tts（播报，分块下发）</text>
  <text class="s" x="640" y="516" text-anchor="middle">0 元账单，吃 CPU</text>

  <!-- ================= 执行层 ================= -->
  <rect class="box" x="810" y="100" width="270" height="150" rx="8"/>
  <text class="t" x="945" y="126" text-anchor="middle">LlamaIndex Workflow</text>
  <text class="s" x="945" y="146" text-anchor="middle">observe → decide → act 显式循环</text>
  <text class="s" x="945" y="162" text-anchor="middle">快照回喂 · notice · 动作回显</text>
  <text class="s" x="945" y="178" text-anchor="middle">审批停等：状态落库，重启续跑</text>
  <text class="s" x="945" y="200" text-anchor="middle">GLM-4-Flash 页面理解（免费档）</text>
  <text class="s" x="945" y="216" text-anchor="middle">glm-4v-flash 视觉兜底（canvas 页）</text>
  <text class="s" x="945" y="236" text-anchor="middle">bge-small-zh 向量化（RAG）</text>

  <rect class="box" x="810" y="300" width="270" height="96" rx="8"/>
  <text class="t" x="945" y="326" text-anchor="middle">Playwright（async）</text>
  <text class="s" x="945" y="346" text-anchor="middle">共享 Browser + 每任务 Context</text>
  <text class="s" x="945" y="362" text-anchor="middle">点击/输入/滚动 · 截图 · 域名白名单闸门</text>
  <text class="s" x="945" y="382" text-anchor="middle">导航目标：api 的 /testsite 或白名单站点</text>

  <rect class="box" x="810" y="430" width="128" height="80" rx="8"/>
  <text class="t" x="874" y="456" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="874" y="474" text-anchor="middle">pgvector（RAG）</text>
  <text class="s" x="874" y="490" text-anchor="middle">tasks/steps/users</text>

  <rect class="box" x="952" y="430" width="128" height="80" rx="8"/>
  <text class="t" x="1016" y="456" text-anchor="middle">runs 卷</text>
  <text class="s" x="1016" y="474" text-anchor="middle">截图 / 轨迹 JSON</text>
  <text class="s" x="1016" y="490" text-anchor="middle">worker 写 · api 读</text>

  <!-- ================= 连线：主链路（灰实线） ================= -->
  <path class="flow" d="M125 160 L125 220"/>
  <path class="flow" d="M210 263 L280 240"/>
  <text class="lbl" x="222" y="242">HTTP :8080</text>
  <path class="flow" d="M470 210 L540 190"/>
  <text class="lbl" x="478" y="192">/api/**</text>

  <path class="flow" d="M610 270 L610 330"/>
  <text class="lbl" x="548" y="306">入队</text>
  <path class="flow" d="M740 360 C 775 360 775 330 810 300"/>
  <text class="lbl" x="748" y="330">arq 消费</text>

  <path class="flow" d="M945 250 L945 300"/>
  <path class="flow" d="M874 430 L874 396" />
  <text class="lbl" x="882" y="410">写状态/步骤</text>
  <path class="flow" d="M1016 430 L1016 396"/>
  <text class="lbl" x="1024" y="410">写截图</text>

  <!-- ================= 连线：次链路（蓝虚线） ================= -->
  <!-- WS 语音 -->
  <path class="flowB" d="M125 306 L125 560 L500 560 L500 520 L540 500"/>
  <text class="lbl" x="150" y="552">WS /api/v1/voice/ws（经 nginx Upgrade）</text>
  <!-- 事件桥回传 -->
  <path class="flowB" d="M810 425 C 780 420 758 402 740 385"/>
  <text class="lbl" x="748" y="436">pub/sub 步骤事件</text>
  
</svg>
